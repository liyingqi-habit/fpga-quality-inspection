name: 仓库基础检查
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repo-baseline:
    name: repo-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4，2026-09-26 官方API核实
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5，2026-09-26 官方API核实
        with:
          python-version: '3.12'
      - name: 工具与结构
        run: |
          python tools/project.py doctor
          python tools/project.py check
      - name: 正反例测试
        run: python -m unittest discover -s tests -v

